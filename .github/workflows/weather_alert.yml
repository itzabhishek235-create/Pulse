name: Daily Weather Alert Bot

on:
  schedule:
    # 01:00 UTC scales exactly to 06:30 AM Indian Standard Time (IST)
    - cron: '0 1 * * *'
  workflow_dispatch: # Keeps the manual "Run workflow" button active for testing

jobs:
  check-and-alert:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set Up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Fetch and Analyze Weather
      id: weather_step
      env:
        OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
      run: python weather_check.py

    # This email action executes conditionally *only* if the Python script sets 'trigger=true'
    - name: Send Alert Email via SMTP
      if: steps.weather_step.outputs.trigger == 'true'
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        secure: true
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: '⚠️ Automated Weather Alert Notification'
        to: ${{ secrets.EMAIL_USERNAME }}
        from: 'GitHub Actions Weather Bot'
        html_body: |
          <h3>Weather Alert Status Breached</h3>
          <p>${{ steps.weather_step.outputs.reason }}</p>
          <br>
          <small>Sent automatically by your cloud workflow.</small>
