name: Daily News Scraper Bot

on:
  schedule:
    # 01:30 UTC converts exactly to 07:00 AM Indian Standard Time (IST)
    - cron: '30 1 * * *'
  workflow_dispatch: # Allows manual trigger button for immediate execution

jobs:
  scrape-and-email:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Files
      uses: actions/checkout@v4

    - name: Configure Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Runtime Requirements
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Execute News Engine Script
      env:
        EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      run: python news_scraper.py
      
